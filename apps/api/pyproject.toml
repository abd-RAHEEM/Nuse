[project]
name = "nuse-api"
version = "0.1.0"
description = "FastAPI backend for Nuse"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "cryptography>=44,<47",
  "httpx>=0.28,<1",
  "httpcore>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that require a configured PostgreSQL database",
]
