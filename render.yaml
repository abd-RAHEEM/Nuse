services:
  - type: web
    name: nuse-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn hub.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PIN_PEPPER
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOW_SIGNUP
        value: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_GMAIL_REDIRECT_URI
        sync: false
      - key: WEB_ORIGIN
        sync: false
